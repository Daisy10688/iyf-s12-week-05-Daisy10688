<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 1: Color Changer</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
    button { padding: 10px 16px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Day 1: Color Changer</h1>
  <h2>Change the heading colors</h2>
  <h3>Click the button below</h3>
  <button id="colorButton">Change Heading Colors</button>

  <script>
    const colorButton = document.querySelector("#colorButton");

    function generateRandomHexColor() {
      return "#" + Math.floor(Math.random() * 16777215)
        .toString(16).padStart(6, "0");
    }

    colorButton.addEventListener("click", function () {
      const headings = document.querySelectorAll("h1, h2, h3");

      headings.forEach(function (heading) {
        heading.style.color = generateRandomHexColor();
      });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 5: Dark Mode Toggle</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background-color: #f4f4f4;
      color: #222;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    .container {
      width: min(100%, 520px);
      padding: 32px;
      border-radius: 14px;
      background-color: white;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      transition: background-color 0.4s ease, box-shadow 0.4s ease;
    }

    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 8px;
      background-color: #2563eb;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    /* Dark mode styles are activated by adding "dark-mode" to the body. */
    body.dark-mode {
      background-color: #181818;
      color: #f5f5f5;
    }

    body.dark-mode .container {
      background-color: #292929;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Dark Mode Toggle</h1>
    <p>Click the button to switch between light mode and dark mode.</p>
    <button id="theme-toggle" type="button">Enable dark mode</button>
  </main>

  <script>
    const toggleButton = document.querySelector("#theme-toggle");
    const body = document.body;

    // Apply the saved theme when the page loads.
    const savedTheme = localStorage.getItem("theme");

    if (savedTheme === "dark") {
      body.classList.add("dark-mode");
    }

    updateButtonText();

    toggleButton.addEventListener("click", function () {
      body.classList.toggle("dark-mode");

      // Save the user's preference for the next visit.
      if (body.classList.contains("dark-mode")) {
        localStorage.setItem("theme", "dark");
      } else {
        localStorage.setItem("theme", "light");
      }

      updateButtonText();
    });

    function updateButtonText() {
      if (body.classList.contains("dark-mode")) {
        toggleButton.textContent = "Enable light mode";
      } else {
        toggleButton.textContent = "Enable dark mode";
      }
    }
  </script>
</body>
</html>
